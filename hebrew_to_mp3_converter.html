<!DOCTYPE html>\n<html lang="he">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Hebrew to MP3 Converter</title>\n    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>\n    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/2.1.1/tesseract.min.js"></script>\n    <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>\n</head>\n<body>\n    <h1>Hebrew to MP3 Converter with OCR</h1>\n    <input type="file" id="fileInput">\n    <button id="uploadBtn">Upload Image</button>\n    <div id="ocrResult"></div>\n    <textarea id="textInput" placeholder="Type or paste text here..." rows="4" cols="50"></textarea>\n    <button id="convertBtn">Convert to MP3</button>\n    <audio id="audioOutput" controls></audio>\n    <script>\n        $(document).ready(function() {\n            $('#uploadBtn').click(function() {\n                const file = document.getElementById('fileInput').files[0];\n                if (file) {\n                    Tesseract.recognize(file, 'heb', {\n                        logger: info => console.log(info)\n                    }).then(({ data: { text } }) => {\n                        $('#ocrResult').text(text);\n                    });\n                } else {\n                    alert('Please upload an image file.');\n                }\n            });\n            $('#convertBtn').click(function() {\n                const text = $('#ocrResult').text() || $('#textInput').val();\n                const blob = new Blob([text], { type: 'audio/mp3' });\n                const url = URL.createObjectURL(blob);\n                $('#audioOutput').attr('src', url);\n                const utterance = new SpeechSynthesisUtterance(text);\n                speechSynthesis.speak(utterance);\n            });\n        });\n    </script>\n</body>\n</html>
